<rect width="512" height="512" rx="110" fill="#1E3328"/>
<style>
@keyframes draw{0%,10%{stroke-dashoffset:1500;opacity:.3}65%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:1500;opacity:.3}}
@keyframes pulse{0%,45%,100%{opacity:.25;transform:scale(.92)}70%,85%{opacity:1;transform:scale(1.13)}}
.lines path{stroke-dasharray:1500;stroke-dashoffset:1500;animation:draw 3.4s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:pulse 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.lines path,.spark{animation:none;stroke-dashoffset:0;opacity:1;transform:none}}
</style>
