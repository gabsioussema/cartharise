try {const raw=localStorage.getItem(KEY);const candidate=raw?JSON.parse(raw):{};state={...defaults(),...candidate,answers:{...defaults().answers,...(candidate.answers||{})},compass:{...defaults().compass,...(candidate.compass||{})},qIndex:{...defaults().qIndex,...(candidate.qIndex||{})}}}catch(e){storageAvailable=false;state=defaults()}

function title(ey,h,lead){return `<div class="eyebrow">${ey}</div><h2>${h}</h2><p class="lead">${lead}</p>`}
function footer(){return `<div class="footer">CARTHARISE · Independent concept inspired in part by <a href="${SOURCE}" target="_blank" rel="noopener noreferrer">Dan Koe's article</a>. Not affiliated with or endorsed by Dan Koe. Not mental health treatment. <a href="cartharise_requirements.html">Product specification</a>.</div>`}
function renderShell(){const shown=['today','academy','reset','compass','missions','campaign','journal','evolution','inspiration','settings'];el('nav').innerHTML=shown.map((k,i)=>`${i===8?'<div class="navlabel">MORE</div>':''}<button type="button" class="navbtn ${page===k?'active':''}" data-nav="${k}" ${page===k?'aria-current="page"':''}><span style="width:19px;text-align:center;font-size:19px;font-weight:400">${ICONS[k]}</span>${NAMES[k]}</button>`).join('');el('mobileNav').innerHTML=shown.map(k=>`<option value="${k}" ${page===k?'selected':''}>${NAMES[k]}</option>`).join('');el('crumb').textContent=`PERSONAL TRANSFORMATION / ${(NAMES[page]||'WELCOME').toUpperCase()}`;el('sideCount').textContent=`${count('morning')+count('day')+count('evening')} of 27 core reflections recorded · ${pct()}%`;el('sideFill').style.width=pct()+'%';el('saveStatus').textContent=storageAvailable?'Saved on this device':'Storage unavailable';}
function welcome(){return `<div class="onboarding"><div class="hero"><div class="eyebrow">YOUR NEXT CHAPTER BEGINS HERE</div><h1>Know yourself.<br><span class="olive">Choose your path.</span><br>Rise with purpose.</h1><p class="lead">Cartharise helps you turn thoughtful questions into a personal direction — then into small, meaningful daily actions.</p><div class="btnrow"><button class="btn primary" data-action="start">Begin your journey →</button><button class="btn ghost" data-nav="inspiration">Explore the inspiration ↗</button></div></div><div class="grid three mt"><div class="stat"><b>01</b><span>Reflect with honesty and care</span></div><div class="stat"><b>02</b><span>Make your own Life Compass</span></div><div class="stat"><b>03</b><span>Practice progress one day at a time</span></div></div><div class="card mt"><div class="section-mini">MAKE IT YOURS</div><div class="grid two"><div class="field"><label for="welcomeName">What should we call you? (optional)</label><input class="input" id="welcomeName" data-bind="name" maxlength="50" placeholder="Your name" value="${esc(state.name)}"></div><div class="field"><label for="welcomeMode">How do you want to begin?</label><select id="welcomeMode" data-bind="mode"><option value="flex" ${state.mode==='flex'?'selected':''}>At my own pace</option><option value="oneday" ${state.mode==='oneday'?'selected':''}>One focused reset day</option></select></div></div><p class="inline-note">Your entries are stored in this browser on this device, without an account. No information is sent to a server by this demo. Avoid sensitive entries on shared devices.</p></div>${footer()}</div>`}
function today(){let done=state.tasks.filter(x=>x.done).length;let active=state.tasks.filter(x=>!x.done).slice(0,3);let greeting=state.name?`, ${esc(state.name)}`:'';return `<div class="hero"><div class="eyebrow">THE JOURNEY IS THE DESTINATION</div><h1>Keep becoming<span class="gold">${greeting}.</span></h1><p class="lead">You don't need to change everything today. Choose one meaningful step, pay attention, and keep learning.</p><div class="btnrow"><button class="btn primary" data-nav="reset">${pct()===100?'Revisit your reset':'Continue your reset'} →</button><button class="btn ghost" data-nav="campaign">Open your campaign ↗</button></div></div><div class="grid four mt"><div class="stat"><b>${pct()}%</b><span>One-day reset recorded</span></div><div class="stat"><b>${count('morning')}/14</b><span>Morning reflections</span></div><div class="stat"><b>${count('day')}/6</b><span>Awareness check-ins</span></div><div class="stat"><b>${count('evening')}/7</b><span>Evening synthesis</span></div></div><div class="grid two mt"><div class="card"><div class="panel-title"><h3>Today's focus</h3><span class="chip">${done}/${state.tasks.length} done</span></div>${state.tasks.length?state.tasks.slice(0,5).map(t=>taskRow(t)).join(''):`<div class="empty">Your quests will live here. Start with one meaningful action.</div>`}<div class="btnrow mt"><button class="btn sm" data-nav="missions">Manage quests →</button></div></div><div class="card soft"><div class="panel-title"><h3>Your north star</h3><span class="chip">Life Compass</span></div><div class="section-mini">VISION</div><p class="quote" style="font-size:23px;margin-top:10px">${state.compass.vision?esc(state.compass.vision):'Your vision will take shape through reflection.'}</p><div class="section-mini">ONE-MONTH PROJECT</div><p class="muted small" style="margin:8px 0 20px">${state.compass.month?esc(state.compass.month):'No project defined yet.'}</p><button class="btn sm" data-nav="compass">Open compass →</button></div></div><div class="section-head"><h3>Your next three chapters</h3></div><div class="grid three"><div class="card"><div class="number">01 · THE MIRROR</div><div class="tiletitle">See clearly</div><p class="muted small">Understand your current reality through honest, personal reflection.</p><button class="btn sm" data-action="phase" data-phase="morning">Open morning →</button></div><div class="card"><div class="number">02 · THE INTERRUPT</div><div class="tiletitle">Notice patterns</div><p class="muted small">Use six small pauses to observe your day as it unfolds.</p><button class="btn sm" data-action="phase" data-phase="day">Open check-ins →</button></div><div class="card"><div class="number">03 · THE BREAKTHROUGH</div><div class="tiletitle">Choose direction</div><p class="muted small">Distill your insights into a vision and practical priorities.</p><button class="btn sm" data-action="phase" data-phase="evening">Open evening →</button></div></div>${footer()}`}
function academy(){return `${title('THE AWAKENING','Understanding before doing','Seven ideas, translated into simpler language. Explore at your pace, then apply what resonates in your own life.')}<div class="callout mb"><b>A note on reflection:</b> these are prompts, not psychological diagnoses or universal rules. You are the expert on your lived experience.</div><div class="grid two">${lessons.map((l,i)=>`<div class="lesson ${openLesson===i?'open':''}"><button data-action="lesson" data-idx="${i}" aria-expanded="${openLesson===i}"><span><span class="meta">${l.label}</span><br>${esc(l.title)}</span><span>${openLesson===i?'−':'+'}</span></button><p>${esc(l.short)}</p><div class="lessonmore"><p>${esc(l.detail)}</p><button class="btn sm" style="width:auto;margin-top:15px" data-nav="reset">Try a reflection →</button></div></div>`).join('')}</div><div class="source mt"><h3>Explore the original inspiration</h3><p>Cartharise is an independent interpretation of ideas found in Dan Koe's <em>How to fix your entire life in 1 day</em>. The complete original adds nuance and context.</p><div class="btnrow"><a class="btn primary" href="${SOURCE}" target="_blank" rel="noopener noreferrer">Read the original article ↗</a><a class="btn" href="${SOURCE_LONG}" target="_blank" rel="noopener noreferrer">Read the author's newsletter ↗</a></div></div>${footer()}`}
function reset(){const p=state.resetStage;return `${title('THE ONE-DAY RESET','A day to find direction.','A three-part guided process: morning reflection, mindful pauses through the day, and an evening plan. You can do it in one day or across several.')}<div class="segment" role="group" aria-label="Reset phases"><button class="${p==='morning'?'active':''}" data-action="phase" data-phase="morning">☀ Morning · ${count('morning')}/14</button><button class="${p==='day'?'active':''}" data-action="phase" data-phase="day">◷ Day · ${count('day')}/6</button><button class="${p==='evening'?'active':''}" data-action="phase" data-phase="evening">☾ Evening · ${count('evening')}/7</button></div>${p==='day'?dayView():questionView(p)}${footer()}`}
function questionView(p){const arr=p==='morning'?morning:evening;const qIndex=Math.min(Math.max(state.qIndex[p]||0,0),arr.length-1);const q=arr[qIndex];const val=state.answers[p][qIndex]||'';return `<div class="question-card"><div class="phasebar"><div class="top"><b>${p==='morning'?'The Mirror & The Vision':'The Breakthrough'}</b><span>Question ${qIndex+1} of ${arr.length}</span></div><div class="progress"><div style="width:${(qIndex+1)/arr.length*100}%"></div></div></div><div class="card" style="padding:clamp(22px,4vw,42px)"><div class="number">${esc(q.group.toUpperCase())} · ${String(qIndex+1).padStart(2,'0')}</div><h2>${esc(q.q)}</h2><p class="muted">Take the time you need. There is no correct answer.</p><button class="btn sm ghost" data-action="toggleHelp" aria-expanded="${helpVisible}">${helpVisible?'Hide explanation −':'✦ Help me understand +'}</button>${helpVisible?`<div class="help"><strong>What this means</strong><p>${esc(q.why)}</p><strong style="display:block;margin-top:14px">Example, not a model answer</strong><p>${esc(q.example)}</p></div>`:''}<div class="field"><label for="qanswer">Your reflection <span class="muted" style="font-weight:400">· autosaved</span></label><textarea id="qanswer" data-bind="answer" data-stage="${p}" data-index="${qIndex}" placeholder="Write what feels true for you right now…">${esc(val)}</textarea></div><div class="inline-note">You may skip or return to this question at any time. Written answers stay in your browser.</div><div class="qbuttons"><button class="btn ghost" data-action="qprev" data-phase="${p}" ${qIndex===0?'disabled':''}>← Back</button><div class="btnrow"><button class="btn ghost" data-action="qnext" data-phase="${p}">Skip for now</button><button class="btn primary" data-action="qnext" data-phase="${p}">${qIndex===arr.length-1?'Finish phase →':'Save & continue →'}</button></div></div></div><div class="section-head"><span class="muted small">Jump to a reflection</span><span class="muted small">● answered · ○ not yet</span></div><div class="pillset">${arr.map((_,i)=>`<button class="pillbtn ${qIndex===i?'active':''}" data-action="qjump" data-phase="${p}" data-index="${i}" aria-label="Go to question ${i+1}${state.answers[p][i]?' (answered)':''}">${state.answers[p][i]?'●':'○'} ${i+1}</button>`).join('')}</div></div>`}
function dayView(){return `<div class="grid two"><div><div class="card"><div class="meta">THE INTERRUPT</div><h3 style="font-family:Georgia,serif;font-size:30px;margin:10px 0">Pause. Notice. Choose.</h3><p class="muted">These six prompts help you notice the difference between what you say you want and what you actually do. Record quick observations whenever appropriate.</p><div class="progress"><div style="width:${count('day')/6*100}%"></div></div><p class="inline-note">${count('day')} of 6 check-ins recorded · No real-time push service in this offline demo.</p><button class="btn sm" data-action="ics">Download 30-day calendar reminders (.ics) ↗</button></div><div class="card mt"><div class="meta">BONUS CONTEMPLATION</div><p class="muted small">Optional thoughts for walks, breaks, or quiet moments.</p>${bonus.map((q,i)=>`<div class="field"><label for="bonus${i}">${i+1}. ${esc(q)}</label><textarea id="bonus${i}" style="min-height:75px" data-bind="answer" data-stage="bonus" data-index="${i}" placeholder="Optional thought…">${esc(state.answers.bonus[i]||'')}</textarea></div>`).join('')}</div></div><div><div class="section-mini mb">SIX DAYTIME PAUSES</div>${day.map((q,i)=>`<details class="checkin" ${state.answers.day[i]?'':''}><summary><span class="time">${esc(state.times[i]||q.time)}</span><span style="flex:1">${esc(q.q)}</span><span class="doneflag">${state.answers.day[i]?'● Done':'+'}</span></summary><p class="muted small" style="margin-top:14px">${esc(q.why)}</p><label class="tiny muted" for="day${i}">Your observation (autosaved)</label><textarea id="day${i}" data-bind="answer" data-stage="day" data-index="${i}" placeholder="What did you notice?">${esc(state.answers.day[i]||'')}</textarea></details>`).join('')}<div class="btnrow mt"><button class="btn primary" data-action="phase" data-phase="evening">Move to evening synthesis →</button><button class="btn ghost" data-nav="settings">Adjust times</button></div></div></div>`}
function compass(){return `${title('THE LIFE COMPASS','A direction you can return to.','Six connected elements translate reflection into a clear, adaptable plan. Your Compass is yours to revise whenever life changes.')}<div class="callout mb">Evening reflection answers can populate your Compass. You can also write directly here. Nothing is generated or inferred by AI.</div><div class="grid two">${compassDefs.map(d=>`<div class="card"><div class="iconcard"><span class="symbol">${d.emoji}</span><div><h3 style="margin:0">${d.title}</h3><div class="muted small">${d.sub}</div></div></div><div class="field"><label for="c_${d.key}">${d.hint}</label><textarea id="c_${d.key}" style="min-height:112px" data-bind="compass" data-key="${d.key}" placeholder="Write your own words…">${esc(state.compass[d.key])}</textarea></div></div>`).join('')}</div><div class="btnrow mt"><button class="btn primary" data-action="sync">Use my evening reflections</button><button class="btn" data-action="tasksFromCompass">Make quests from daily levers</button><button class="btn ghost" data-nav="missions">Go to missions →</button></div>${footer()}`}

function missions(){let done=state.tasks.filter(x=>x.done).length;return `${title('THE BECOMING','Turn intention into action.','Choose a few concrete priorities. Completing them is feedback, not a measure of your worth. Rest is allowed.')}<div class="grid two"><div class="card"><div class="panel-title"><h3>Today's quests</h3><span class="chip">${done} / ${state.tasks.length} complete</span></div><div class="progress" style="margin-bottom:18px"><div style="width:${state.tasks.length?done/state.tasks.length*100:0}%"></div></div>${state.tasks.length?state.tasks.map(taskRow).join(''):`<div class="empty">Your first quest can be tiny.<br>“Spend 10 minutes exploring an idea” counts.</div>`}<form id="taskForm" class="field" style="margin-top:18px"><label for="newTask">Add a small meaningful action</label><div style="display:flex;gap:7px"><input id="newTask" class="input" maxlength="180" placeholder="e.g. Write for 15 minutes" required><button type="submit" class="btn primary">Add +</button></div></form><p class="inline-note">These checkboxes stay completed until you clear or remove them. Production will need recurring tasks and day-specific records.</p></div><div><div class="card soft"><div class="meta">THE MISSION</div><h3 style="font-family:Georgia,serif;font-size:28px">One year</h3><p>${state.compass.year?esc(state.compass.year):'<span class="muted">Define your one-year direction in the Compass.</span>'}</p><div class="divider"></div><div class="meta">THE CURRENT PROJECT</div><h3 style="font-family:Georgia,serif;font-size:28px">One month</h3><p>${state.compass.month?esc(state.compass.month):'<span class="muted">Choose a one-month project in the Compass.</span>'}</p><button class="btn sm" data-nav="compass">Edit Compass →</button></div><div class="card mt"><div class="meta">A BETTER DEFINITION OF PROGRESS</div><p class="muted small">One completed action, a boundary respected, a useful observation, or a conscious rest day can all represent growth. The goal is learning, not a perfect streak.</p><button class="btn sm ghost" data-nav="evolution">Reflect on progress →</button></div></div></div>${path30()}${footer()}`}
function path30(){const filled=Object.values(state.dayEntries||{}).filter(x=>String(x).trim()).length;return `<div class="card mt"><div class="panel-title"><div><div class="meta">30 DAYS OF BECOMING · OPTIONAL</div><h3 style="font-family:Georgia,serif;font-size:29px;margin:9px 0 0">A gentle daily practice</h3></div><span class="chip">${filled}/30 noted</span></div><p class="muted small">Four evolving chapters: observe, experiment, build, and adjust. Explore any day, in any order, without a streak or deadline. Each reflection is saved automatically.</p><div class="progress"><div style="width:${filled/30*100}%"></div></div><div class="pillset mt" aria-label="Thirty-day journey">${pathPrompts.map((_,i)=>`<button class="pillbtn ${selectedDay===i+1?'active':''}" data-action="selectDay" data-index="${i+1}" aria-label="Open day ${i+1}${state.dayEntries?.[i+1]?' with saved note':''}">${state.dayEntries?.[i+1]?'●':'○'} ${i+1}</button>`).join('')}</div><div class="help mt"><div class="meta">${selectedDay<=7?'OBSERVE':selectedDay<=14?'EXPERIMENT':selectedDay<=21?'BUILD':'ADJUST'} · DAY ${selectedDay}</div><h3 style="font-family:Georgia,serif;font-size:24px;margin-top:9px">${esc(pathPrompts[selectedDay-1])}</h3><label class="small muted" for="day30">Your note (autosaved)</label><textarea id="day30" data-bind="day30" data-index="${selectedDay}" placeholder="A few words are enough…" style="min-height:95px">${esc(state.dayEntries?.[selectedDay]||'')}</textarea><div class="btnrow" style="margin-top:12px"><button class="btn sm ghost" data-action="selectDay" data-index="${Math.max(1,selectedDay-1)}" ${selectedDay===1?'disabled':''}>← Previous</button><button class="btn sm" data-action="selectDay" data-index="${Math.min(30,selectedDay+1)}" ${selectedDay===30?'disabled':''}>Next day →</button></div></div><p class="inline-note">These 30 prompts are a Cartharise original extension, not part of Dan Koe’s original checklist.</p></div>`}
function journal(){const draft=editJournalId?state.journal.find(j=>j.id===editJournalId):null;return `${title('THE JOURNAL','A private place to think.','Capture thoughts without needing to turn every moment into a goal. Revisit your story at your own pace.')}<div class="grid two"><div class="card"><h3>${draft?'Edit your entry':'Write a new entry'}</h3><form id="journalForm"><div class="field"><label for="journalTitle">Title (optional)</label><input id="journalTitle" class="input" maxlength="100" placeholder="What is on your mind?" value="${draft?esc(draft.title):''}"></div><div class="field"><label for="journalBody">Your thoughts</label><textarea id="journalBody" placeholder="A thought, a lesson, a moment, an observation…" style="min-height:200px" required>${draft?esc(draft.body):''}</textarea></div><div class="btnrow"><button type="submit" class="btn primary">${draft?'Save edits':'Save reflection'}</button>${draft?'<button type="button" class="btn ghost" data-action="cancelEdit">Cancel</button>':''}</div></form></div><div><div class="section-head" style="margin-top:0"><h3>Your entries</h3><span class="chip">${state.journal.length} notes</span></div>${state.journal.length?state.journal.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(j=>`<div class="card" style="margin-bottom:12px"><div class="meta">${new Date(j.createdAt).toLocaleDateString()}</div><h3 style="margin:7px 0">${esc(j.title||'Untitled reflection')}</h3><p class="muted small review-card">${esc(j.body)}</p><div class="btnrow"><button class="btn sm ghost" data-action="editJournal" data-id="${j.id}">Edit</button><button class="btn sm danger" data-action="deleteJournal" data-id="${j.id}">Delete</button></div></div>`).join(''):'<div class="empty">Your first journal entry has not been written yet.</div>'}</div></div>${footer()}`}
function evolution(){return `${title('THE EVOLUTION','Reflect. Adjust. Continue.','A weekly review helps you notice what is working, what is difficult, and how your direction may need to change.')}<div class="grid two"><div class="card"><div class="meta">WEEKLY REFLECTION</div><h3>Review the last seven days</h3><form id="reviewForm"><div class="field"><label for="reviewWins">What felt meaningful or went well?</label><textarea id="reviewWins" style="min-height:95px" required placeholder="A small action, a conversation, a moment of clarity…"></textarea></div><div class="field"><label for="reviewFriction">What got in your way, and what did you learn?</label><textarea id="reviewFriction" style="min-height:95px" placeholder="Look for conditions and patterns, not blame."></textarea></div><div class="field"><label for="reviewNext">What will you adjust next week?</label><textarea id="reviewNext" style="min-height:95px" placeholder="One experiment or a gentler boundary."></textarea></div><button type="submit" class="btn primary">Save weekly review</button></form></div><div><div class="card soft"><div class="meta">YOUR GROWTH RECORD</div><div class="grid two mt"><div class="stat"><b>${state.reviews.length}</b><span>Weekly reviews</span></div><div class="stat"><b>${state.journal.length}</b><span>Journal entries</span></div></div><p class="muted small mt">Cartharise does not assign you a psychological score. Patterns emerge from your own words over time.</p></div><div class="section-head"><h3>Previous reviews</h3></div>${state.reviews.length?state.reviews.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(r=>`<div class="card" style="margin-bottom:12px"><div class="meta">${new Date(r.createdAt).toLocaleDateString()}</div><p class="small review-card"><b>What worked:</b> ${esc(r.wins)}</p><p class="small review-card"><b>What I learned:</b> ${esc(r.friction||'—')}</p><p class="small review-card"><b>Next adjustment:</b> ${esc(r.next||'—')}</p><button class="btn sm danger" data-action="deleteReview" data-id="${r.id}">Delete review</button></div>`).join(''):'<div class="empty">Your weekly reflections will appear here.</div>'}</div></div>${footer()}`}

function campaign(){
  const answers=state.answers;
  const countRange=(start,end)=>Array.from({length:end-start},(_,i)=>start+i).filter(i=>String(answers.morning[i]||'').trim()).length;
  const acts=[
    {name:'See the terrain',detail:'Current reality · 4 reflections',done:countRange(0,4),total:4,target:'morning',desc:'Notice dissatisfaction, repeated complaints, and your actual behavior.'},
    {name:'Find the pattern',detail:'Anti-vision & identity · 7 reflections',done:countRange(4,11),total:7,target:'morning',desc:'Explore the future you want to avoid and self-protection patterns.'},
    {name:'Raise your banner',detail:'Future vision · 3 reflections',done:countRange(11,14),total:3,target:'morning',desc:'Imagine a better ordinary day and define a small identity-aligned action.'},
    {name:'Break autopilot',detail:'Daytime awareness · 6 check-ins',done:count('day'),total:6,target:'day',desc:'Notice your choices throughout a real day.'},
    {name:'Plan the campaign',detail:'Evening synthesis · 7 reflections',done:count('evening'),total:7,target:'evening',desc:'Turn reflection into a one-year goal, one-month project, and daily levers.'}
  ];
  const doneTasks=state.tasks.filter(t=>t.done).length;
  const doneDays=Object.values(state.dayEntries||{}).filter(x=>String(x).trim()).length;
  const xp=Math.min(135,(count('morning')+count('day')+count('evening'))*5)+doneTasks*20+doneDays*10+state.campaignLogs.length*15+state.reviews.length*15;
  const level=1+Math.floor(xp/100),stepXp=xp%100;
  const badges=[['The Observer',acts[0].done===4,'Completed present-reality reflections'],['The Pathfinder',acts[1].done===7,'Explored anti-vision and identity'],['The Visionary',acts[2].done===3,'Defined a possible future'],['The Watchful',acts[3].done===6,'Recorded all six daytime pauses'],['The Strategist',acts[4].done===7,'Completed evening planning'],['The Practitioner',doneTasks>0,'Completed a real-world quest']];
  return `${title('THE CAMPAIGN · INSPIRED BY DAN KOE','Make your life playable.','Dan Koe’s original framework becomes a personal strategy game: vision is the win condition, anti-vision is what is at stake, the one-year goal is your mission, the one-month project is your boss fight, daily actions are quests, and constraints are the rules.')}
    <div class="gamebar"><div><div class="meta">YOUR CAMPAIGN STATUS</div><div class="level">Level ${level} · ${xp} XP</div><p class="muted small" style="margin:8px 0 0">XP reflects participation and practice, never your worth. No streak penalties.</p></div><div style="width:min(300px,100%);flex:1"><div class="panel-title"><span class="tiny muted">LEVEL ${level}</span><span class="tiny muted">${stepXp} / 100 XP</span></div><div class="xp-track"><div style="width:${stepXp}%"></div></div></div></div>
    <div class="section-head"><h3>Act I · The one-day awakening</h3><span class="chip">${acts.filter(a=>a.done===a.total).length} / 5 chapters explored</span></div>
    <div class="act-track">${acts.map((a,i)=>`<div class="act ${a.done===a.total?'complete':''}"><div class="num">CHAPTER ${String(i+1).padStart(2,'0')} ${a.done===a.total?'✓':''}</div><strong>${a.name}</strong><small>${a.detail}</small><div class="progress" style="margin:12px 0 9px"><div style="width:${a.done/a.total*100}%"></div></div><div class="tiny muted">${a.done} of ${a.total} done</div><button class="btn sm ghost" style="margin-top:13px" data-action="campaignStage" data-phase="${a.target}">Explore ↗</button></div>`).join('')}</div>
    <div class="grid two mt"><div class="card"><div class="meta">THE STRATEGIST'S MAP</div><h3 style="margin-top:9px">Six components from Section VII</h3>
      ${[['Your stakes · Anti-vision','anti'],['Win condition · Vision','vision'],['Main campaign · 1-year mission','year'],['Monthly boss · 1-month project','month'],['Daily quests · Daily levers','daily'],['Rules of engagement · Constraints','constraints']].map(([label,key])=>`<div class="game-concept"><strong>${label}</strong><div style="margin-top:4px">${state.compass[key]?esc(state.compass[key]):'<em>Not yet defined — write this in your Life Compass.</em>'}</div></div>`).join('')}
      <div class="btnrow mt"><button class="btn primary sm" data-nav="compass">Build your strategy →</button><button class="btn sm" data-nav="missions">Open daily quests</button></div>
    </div><div class="card"><div class="meta">MONTHLY BOSS FIGHT</div><h3 style="margin-top:9px">Your real-world experiment</h3><p class="muted small">The boss is the obstacle or project, not yourself or other people. Record attempts and what you learned. There is no punishment for setbacks.</p>
    <div class="callout" style="margin:13px 0">${state.compass.month?esc(state.compass.month):'Your monthly project will appear here when you define it.'}</div>
    <form id="bossForm"><div class="field"><label for="bossAttempt">What did you actually try?</label><textarea id="bossAttempt" required minlength="2" maxlength="700" style="min-height:83px" placeholder="I tested a 20-minute focus block, reached out to someone, or built a first draft…"></textarea></div><div class="field"><label for="bossLearning">What did you learn? (optional)</label><textarea id="bossLearning" maxlength="700" style="min-height:80px" placeholder="What worked, what did not, and what will you change next time?"></textarea></div><button class="btn primary" type="submit">Record this attempt · +15 XP</button></form>
    <div class="mt"><div class="meta">BATTLE LOG · ${state.campaignLogs.length} ATTEMPTS</div>${state.campaignLogs.length?state.campaignLogs.slice().reverse().slice(0,5).map(l=>`<div class="bosslog"><div class="tiny gold">${esc(l.date)}</div><strong>${esc(l.attempt)}</strong>${l.learning?`<p class="muted small" style="margin:5px 0 0">Learned: ${esc(l.learning)}</p>`:''}</div>`).join(''):'<p class="muted small" style="margin-top:10px">No attempts recorded yet. Your first one can be tiny.</p>'}</div></div></div>
    <div class="section-head"><h3>Achievements from the article</h3><span class="muted small">Earned through exercises, not perfect answers</span></div><div class="badgegrid">${badges.map(([label,earned,description])=>`<div class="merit ${earned?'earned':''}"><div style="font-size:24px">${earned?'✺':'◇'}</div><strong>${label}</strong><small>${description}</small></div>`).join('')}</div>
    <div class="card mt"><div class="meta">ACT II · THE 30-DAY BECOMING</div><h3 style="margin:9px 0">Practice your strategy in ordinary life</h3><p class="muted">Your one-year mission is a direction, not a deadline imposed by the app. Work on your monthly project, do real daily quests, notice patterns, and reflect. Review and adjust your strategy whenever new evidence appears.</p><div class="grid three"><div class="stat"><b>${doneTasks}</b><span>Completed quests</span></div><div class="stat"><b>${doneDays}</b><span>30-day reflections</span></div><div class="stat"><b>${state.campaignLogs.length}</b><span>Boss attempts recorded</span></div></div><div class="btnrow mt"><button class="btn primary sm" data-nav="missions">Continue the 30-day journey →</button><a class="btn sm ghost" href="${SOURCE}" target="_blank" rel="noopener noreferrer">Read the X article ↗</a></div></div>
    <p class="inline-note">Interpretation of the game framework in Section VII of Dan Koe’s article. XP, levels, chapters, achievement names, and battle logs are Cartharise features, not claims made by the article. Reflection is skippable. Personal notes stay in this browser.</p>${footer()}`;
}

function inspiration(){return `${title('THE INSPIRATION','Ideas worth exploring deeply.','Cartharise was inspired in part by Dan Koe’s article, alongside the broader idea that self-understanding becomes meaningful through action.')}<div class="source"><div class="eyebrow">ORIGINAL REFERENCE</div><h2 style="font-size:clamp(31px,4vw,49px)">How to fix your entire life in 1 day</h2><p style="font-size:15px">By <b>Dan Koe</b>. The source explores identity, behavior, reflection, self-direction, and a practical morning–day–evening protocol.</p><div class="btnrow"><a class="btn primary" href="${SOURCE}" target="_blank" rel="noopener noreferrer">Read Dan Koe's X article ↗</a><a class="btn" href="${SOURCE_LONG}" target="_blank" rel="noopener noreferrer">Author's newsletter ↗</a></div></div><div class="grid two mt"><div class="card"><h3>What we learned from the article</h3><ul class="bullet"><li>Look beneath surface-level resolutions.</li><li>Observe patterns instead of relying on intentions alone.</li><li>Clarify both what you want and what you want to avoid.</li><li>Use frequent pauses to notice automatic behavior.</li><li>Connect direction with projects, daily steps, and boundaries.</li></ul></div><div class="card"><h3>What Cartharise adds</h3><ul class="bullet"><li>Beginner-friendly explanations and neutral examples.</li><li>A skippable, accessible guided interface.</li><li>Save progress and pick up later.</li><li>A persistent, editable Life Compass.</li><li>Small daily quests, journaling, and weekly reflections.</li></ul></div></div><div class="card mt"><h3>Independent interpretation & attribution</h3><p class="muted small">Cartharise is an independent educational self-development concept, not created by, affiliated with, or endorsed by Dan Koe. Its in-app questions are paraphrased and adapted for a supportive interactive format. They are not a replacement for reading the full original, nor a medical or psychological assessment. We encourage every user to read the source directly.</p></div>${footer()}`}
function settings(){return `${title('PREFERENCES','Make the journey yours.','Adjust your experience, export your writing, or start again. Your information belongs to you.')}<div class="grid two"><div class="card"><h3>Your preferences</h3><div class="field"><label for="settingsName">Name (optional)</label><input id="settingsName" class="input" data-bind="name" maxlength="50" value="${esc(state.name)}" placeholder="What should we call you?"></div><div class="field"><label for="settingsMode">Reset pace</label><select id="settingsMode" data-bind="mode"><option value="flex" ${state.mode==='flex'?'selected':''}>Flexible: no deadline</option><option value="oneday" ${state.mode==='oneday'?'selected':''}>One-day guided reset</option></select></div><h3 style="margin:27px 0 8px">Check-in times</h3><p class="muted small">These are used when exporting a calendar reminder file; this offline page does not send push notifications.</p><div class="grid two">${day.map((q,i)=>`<div class="field"><label for="time${i}">Pause ${i+1}</label><input id="time${i}" class="input" type="time" data-bind="time" data-index="${i}" value="${esc(state.times[i]||q.time)}"></div>`).join('')}</div><button class="btn primary" data-action="ics">Download calendar reminders (.ics)</button></div><div><div class="card"><h3>Your data</h3><p class="muted small">This prototype stores information only in this browser's local storage. It is not encrypted, not synced between devices, and can be lost if browser data is cleared. Avoid entering highly sensitive details on shared computers.</p><div class="btnrow"><button class="btn" data-action="export">Export my data (.json)</button><button class="btn ghost" data-action="import">Import a backup</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><div class="divider"></div><button class="btn danger" data-action="clear">Erase all local data</button></div><div class="card mt"><h3>About this prototype</h3><p class="muted small">Fully interactive without external dependencies. Includes client-side persistence, reflections, a Compass, quests, check-ins, calendar export, and personal journal. It does not include accounts, cloud sync, real push notifications, AI, or production security infrastructure.</p><div class="btnrow"><button class="btn sm ghost" data-nav="inspiration">Article & attribution</button><a class="btn sm ghost" href="cartharise_requirements.html">Requirements specification ↗</a></div></div></div></div>${footer()}`}
function render(){renderShell();el('view').innerHTML=({welcome,today,academy,reset,compass,missions,campaign,journal,evolution,inspiration,settings}[page]||today)();}
function newId(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function syncCompass(){let n=0;for(const [idx,key] of [[2,'anti'],[3,'vision'],[4,'year'],[5,'month'],[6,'daily']]){if(!state.compass[key] && state.answers.evening[idx]?.trim()){state.compass[key]=state.answers.evening[idx].trim();n++}}save();return n;}
function tasksFromCompass(){const raw=state.compass.daily.trim();if(!raw){toast('Write your daily levers in the Compass first.');return}const items=raw.split(/\n|;|•/).map(x=>x.trim().replace(/^[-\d.)\s]+/,'')).filter(Boolean).slice(0,3);let made=0;items.forEach(text=>{if(!state.tasks.some(t=>t.text.toLowerCase()===text.toLowerCase())){state.tasks.push({id:newId(),text,done:false,createdAt:new Date().toISOString()});made++}});save();toast(`${made} new quest${made===1?'':'s'} created.`)}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
function downloadICS(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CARTHARISE//Personal Check-ins//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];const start=new Date();start.setDate(start.getDate()+1);const today=start.getFullYear()+String(start.getMonth()+1).padStart(2,'0')+String(start.getDate()).padStart(2,'0');for(let i=0;i<6;i++){const tt=(state.times[i]||day[i].time).replace(':','')+'00';const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');lines.push('BEGIN:VEVENT',`UID:cartharise-${i}-${Date.now()}@local`,`DTSTAMP:${stamp}`,`DTSTART:${today}T${tt}`,`DURATION:PT5M`,`RRULE:FREQ=DAILY;COUNT=30`,`SUMMARY:${icsEsc('Cartharise · Pause '+(i+1))}`,`DESCRIPTION:${icsEsc(day[i].q+' Open your Cartharise app to reflect.')}`,'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(day[i].q)}`,'END:VALARM','END:VEVENT')}lines.push('END:VCALENDAR');download('cartharise-30-day-checkins.ics',lines.join('\r\n'),'text/calendar;charset=utf-8');toast('Calendar file downloaded. Import it into your calendar app.')}
function handleAction(action,btn){const phase=btn.dataset.phase;const idx=Number(btn.dataset.index);const id=btn.dataset.id;
if(action==='start'){state.started=true;save();go('today');toast('Welcome to your journey.');}
else if(action==='campaignStage'){state.resetStage=phase;save();go('reset')}
else if(action==='phase'){state.resetStage=phase;save();go('reset')}
else if(action==='qnext'||action==='qprev'||action==='qjump'){const size=phase==='morning'?morning.length:evening.length;const cur=state.qIndex[phase];if(action==='qjump')state.qIndex[phase]=idx;else if(action==='qprev')state.qIndex[phase]=Math.max(0,cur-1);else if(cur>=size-1){if(phase==='morning'){state.resetStage='day';toast('Morning reflections saved.')}else{syncCompass();state.resetStage='evening';toast('Evening reflection saved. Your Compass is ready.');go('compass');return}}else state.qIndex[phase]=cur+1;helpVisible=false;save();render();el('qanswer')?.focus({preventScroll:true})}
else if(action==='toggleHelp'){helpVisible=!helpVisible;render();el('qanswer')?.focus({preventScroll:true})}
else if(action==='lesson'){openLesson=openLesson===idx?-1:idx;render()}
else if(action==='sync'){const n=syncCompass();render();toast(n?`${n} fields imported from your reflections.`:'No new fields to import. Existing Compass entries were preserved.');}
else if(action==='tasksFromCompass'){tasksFromCompass();render()}
else if(action==='removeTask'){state.tasks=state.tasks.filter(t=>t.id!==id);save();render();toast('Quest removed.');}
else if(action==='editJournal'){editJournalId=id;render();scrollTop();}
else if(action==='cancelEdit'){editJournalId=null;render()}
else if(action==='deleteJournal'){if(confirm('Delete this journal entry?')){state.journal=state.journal.filter(j=>j.id!==id);save();render();toast('Entry deleted.')}}
else if(action==='deleteReview'){if(confirm('Delete this weekly review?')){state.reviews=state.reviews.filter(r=>r.id!==id);save();render();}}
else if(action==='selectDay'){selectedDay=Math.max(1,Math.min(30,idx));render()}
else if(action==='ics'){downloadICS()}
else if(action==='export'){download('cartharise-personal-backup.json',JSON.stringify({app:'cartharise',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'application/json');toast('Backup exported.');}
else if(action==='import'){el('importFile').click()}
else if(action==='clear'){if(confirm('Delete all Cartharise data stored in this browser? This cannot be undone unless you exported a backup.')){state=defaults();save();page='welcome';render();scrollTop();toast('Local data cleared.')}}
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();go(nav.dataset.nav);return}const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b.dataset.action,b)}});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.bind==='answer'){state.answers[d.stage][d.index]=e.target.value;save();}else if(d.bind==='compass'){state.compass[d.key]=e.target.value;save()}else if(d.bind==='day30'){state.dayEntries[d.index]=e.target.value;save()}else if(d.bind==='name'){state.name=e.target.value;save()}else if(d.bind==='time'){state.times[Number(d.index)]=e.target.value;save()}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.bind==='mode'){state.mode=e.target.value;save()}else if(d.bind==='taskdone'){const t=state.tasks.find(t=>t.id===d.id);if(t){t.done=e.target.checked;save();render();toast(t.done?'Quest completed. Well done.':'Quest reopened.')}}else if(e.target.id==='mobileNav'){go(e.target.value)}else if(e.target.id==='importFile'){const file=e.target.files?.[0];if(!file)return;file.text().then(txt=>{const obj=JSON.parse(txt);if(obj.app!=='cartharise'||!obj.data||!obj.data.answers||!obj.data.compass)throw Error('Invalid Cartharise backup');if(!confirm('Replace the current local data with this backup?'))return;state={...defaults(),...obj.data,answers:{...defaults().answers,...obj.data.answers},compass:{...defaults().compass,...obj.data.compass}};save();go('today');toast('Backup imported.');}).catch(()=>toast('Could not read this backup.')).finally(()=>{e.target.value=''});}});
document.addEventListener('submit',e=>{if(e.target.id==='bossForm'){e.preventDefault();const attempt=el('bossAttempt').value.trim();const learning=el('bossLearning').value.trim();if(!attempt)return;state.campaignLogs.push({id:newId(),date:new Date().toISOString().slice(0,10),attempt,learning});save();render();toast('Attempt recorded. Learning is progress.')}else if(e.target.id==='taskForm'){e.preventDefault();const input=el('newTask');let text=input.value.trim();if(!text)return;state.tasks.push({id:newId(),text,done:false,createdAt:new Date().toISOString()});save();render();toast('Quest added.')}else if(e.target.id==='journalForm'){e.preventDefault();const body=el('journalBody').value.trim();if(!body)return;const title=el('journalTitle').value.trim();if(editJournalId){const j=state.journal.find(x=>x.id===editJournalId);if(j){j.body=body;j.title=title;j.updatedAt=new Date().toISOString()}editJournalId=null}else state.journal.push({id:newId(),title,body,createdAt:new Date().toISOString()});save();render();toast('Journal entry saved.')}else if(e.target.id==='reviewForm'){e.preventDefault();state.reviews.push({id:newId(),wins:el('reviewWins').value.trim(),friction:el('reviewFriction').value.trim(),next:el('reviewNext').value.trim(),createdAt:new Date().toISOString()});save();render();toast('Weekly review saved.')}});
render();
})();
</script>
</body>
</html>
